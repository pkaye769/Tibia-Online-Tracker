services:
  - type: web
    name: tibia-alt-finder-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/altfinder/health
    envVars:
      - key: APP
        value: altfinder
      - key: TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: BAZAAR_WORLD
        value: Nefera
      - key: TRACKER_WORLDS
        value: Nefera
      - key: TRACKER_INTERVAL_SECONDS
        value: "15"
      - key: DB_HOST
        fromDatabase:
          name: tibia-tracker-db
          property: hostExternalName
      - key: DB_PORT
        fromDatabase:
          name: tibia-tracker-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: tibia-tracker-db
          property: user
      - key: DB_NAME
        fromDatabase:
          name: tibia-tracker-db
          property: database
      - key: DB_PASSWORD
        fromDatabase:
          name: tibia-tracker-db
          property: password

  - type: worker
    name: tibia-online-tracker-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP
        value: tracker
      - key: TRACKER_WORLDS
        value: Nefera
      - key: TRACKER_INTERVAL_SECONDS
        value: "15"
      - key: DB_HOST
        fromDatabase:
          name: tibia-tracker-db
          property: hostExternalName
      - key: DB_PORT
        fromDatabase:
          name: tibia-tracker-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: tibia-tracker-db
          property: user
      - key: DB_NAME
        fromDatabase:
          name: tibia-tracker-db
          property: database
      - key: DB_PASSWORD
        fromDatabase:
          name: tibia-tracker-db
          property: password

  - type: web
    name: tibia-scout-board
    runtime: static
    staticPublishPath: ./web

databases:
  - name: tibia-tracker-db
    plan: free
    databaseName: tibia_tracker
    user: tibia_tracker
